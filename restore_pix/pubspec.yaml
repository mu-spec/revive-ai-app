name: restore_pix
description: ReviveAI - Restore Old Memories, Bring Old Photos Back to Life, and Fix Blurry Photos Instantly. Highly optimized for all Android devices.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State management
  provider: ^6.1.2

  # Android Native Helpers
  image_picker: ^1.1.2
  image_gallery_saver: ^2.0.3
  share_plus: ^10.0.0
  path_provider: ^2.1.3
  shared_preferences: ^2.2.3
  url_launcher: ^6.3.0

  # Iconography & UI
  font_awesome_flutter: ^10.7.0
  flutter_spinkit: ^5.2.1
  cached_network_image: ^3.3.1
  shimmer: ^3.0.0

  # Native Dart Image Processing Engine (100% Free On-Device AI/Filter Simulator)
  image: ^4.2.0

dependency_overrides:
  win32: ^5.5.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/samples/old_photo.jpg
    - assets/samples/blurry_face.jpg
    - assets/samples/bw_photo.jpg
